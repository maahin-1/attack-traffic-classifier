[project]
name = "attack-traffic-classifier"
version = "0.2.0"
description = "Auditable offline comparison of original and corrected intrusion datasets"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
training = [
    "numpy==2.5.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "PyYAML==6.0.3",
    "psutil==7.2.2",
]
report = ["matplotlib==3.11.0", "pyarrow==25.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["attack_traffic"]
